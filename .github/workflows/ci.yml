name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Real Postgres for internal/store's database tests, which skip without
    # DATABASE_URL (the dev PC has no Postgres, so this is where they run).
    # Same version as compose.yaml. The password only exists for this job.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: platform
        ports:
          - 5432:5432
        # Actions waits for the service to be healthy before running steps.
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          DATABASE_URL: postgres://platform:ci-only@localhost:5432/platform?sslmode=disable
        run: go test -race -cover ./...

      - name: Build
        run: go build ./...

      # The sample app is its own module, outside backend/. CI's compose
      # step builds and deploys it; this checks the code itself.
      - name: Example app
        working-directory: examples/hello
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...

  frontend:
    name: Frontend (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Plain `docker build` (BuildKit is the default) rather than a
      # build action: nothing is pushed, so there's nothing to configure.
      - name: Build
        run: docker build -t ops-dashboard:ci .

      - name: Check the HEALTHCHECK is set
        run: |
          test "$(docker inspect -f '{{json .Config.Healthcheck.Test}}' ops-dashboard:ci)" = '["CMD","/dashboard","-healthcheck"]'

      # The platform binary from the same image, against a real Postgres. The
      # platform is started first, on purpose: Postgres takes a few seconds to
      # initialise, so this also covers waiting for the database (as after a
      # reboot) before migrating and listening.
      - name: Smoke test the platform
        run: |
          docker network create ci
          docker run -d --name platform --network ci --entrypoint /platform \
            -e DATABASE_URL='postgres://platform:ci-only@db:5432/platform?sslmode=disable' \
            -e PLATFORM_SECRET_KEY="$(openssl rand -hex 32)" \
            -e APPS_DOMAIN=apps.test \
            ops-dashboard:ci
          docker run -d --name db --network ci \
            -e POSTGRES_USER=platform -e POSTGRES_PASSWORD=ci-only -e POSTGRES_DB=platform \
            postgres:18.6
          for i in $(seq 1 30); do
            if docker exec platform /platform -healthcheck; then
              docker logs platform 2>&1 | grep 'database schema up to date'
              exit 0
            fi
            sleep 1
          done
          docker logs platform
          docker logs db
          exit 1

      # Start the image and run the same command Docker's HEALTHCHECK runs.
      # There's no socket proxy here, so polling Docker fails (and logs
      # errors), but /healthz doesn't depend on Docker, so it should pass.
      - name: Smoke test
        run: |
          docker run -d --name dashboard ops-dashboard:ci
          for i in $(seq 1 10); do
            if docker exec dashboard /dashboard -healthcheck; then
              exit 0
            fi
            sleep 1
          done
          docker logs dashboard
          exit 1

      # The whole stack exactly as the server runs it: compose.yaml's
      # volumes, networks, healthchecks and hardening options, which the
      # docker run steps above don't exercise. --wait fails the step unless
      # every service becomes healthy.
      - name: Compose stack
        env:
          POSTGRES_PASSWORD: ci-only
          APPS_DOMAIN: apps.test
          # The server uses its Tailscale IP; here, the runner's loopback.
          APPS_LISTEN_IP: 127.0.0.1
          # Raises the platform's GitHub rate limit; CI runners share IPs,
          # so the anonymous 60 requests an hour can run out.
          GITHUB_TOKEN: ${{ github.token }}
          # Turns on push-to-deploy; the tests below sign deliveries with it.
          GITHUB_WEBHOOK_SECRET: ci-only-webhook-secret-0123456789abcdef
          # The commit to deploy in the end-to-end test: this one. (For a
          # pull request, the branch head rather than GitHub's merge commit.)
          DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          # A fresh key per run rather than one committed to the repo. It
          # must stay the same for the whole step, across the restart below.
          export PLATFORM_SECRET_KEY="$(openssl rand -hex 32)"
          docker compose up -d --build --wait --wait-timeout 180 || { docker compose ps -a; docker compose logs; exit 1; }
          curl -fsS http://127.0.0.1:8080/healthz
          # The dashboard sees the new services (proxy -> Docker works). Plain
          # grep, not -q: -q exits at the first match, which can fail curl
          # with a broken pipe, and pipefail would count that as no match.
          for i in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:8080/api/containers | grep '"name":"dashboard-postgres-1"' >/dev/null; then
              break
            fi
            [ "$i" = 10 ] && { docker compose logs dashboard; exit 1; }
            sleep 1
          done
          # The platform reaches Docker through its write proxy (logged in the
          # background at startup, so allow it a few seconds).
          for i in $(seq 1 10); do
            docker compose logs --no-log-prefix platform | grep 'docker reachable' && break
            [ "$i" = 10 ] && { docker compose logs platform; exit 1; }
            sleep 1
          done
          # The write proxy allows what deploys need and refuses the rest,
          # probed from a throwaway container on its network.
          probe() {
            docker run --rm --network dashboard_docker-rw curlimages/curl:8.11.1 \
              -s -o /dev/null -w '%{http_code}' -X "$1" "http://docker-proxy-rw:2375$2"
          }
          test "$(probe GET /containers/json)" = 200
          test "$(probe GET /images/json)" = 200
          test "$(probe POST /exec/none/start)" = 403
          test "$(probe GET /volumes)" = 403
          test "$(probe GET /secrets)" = 403
          # A real build through the write proxy, sent the way engine.Build
          # sends it: the legacy builder (version=1), the context as the
          # request body, a base image Docker has to pull. Unit tests use a
          # fake daemon, so this is what proves builds work through /build
          # alone. (BuildKit failed here with "no active sessions": it needs
          # a client-side session to resolve base images.)
          mkdir -p /tmp/build-probe
          printf 'FROM busybox:1.37.0\nRUN echo built > /done\n' > /tmp/build-probe/Dockerfile
          tar -C /tmp/build-probe -c Dockerfile | docker run --rm -i --network dashboard_docker-rw curlimages/curl:8.11.1 \
            -sS --data-binary @- -H 'Content-Type: application/x-tar' \
            'http://docker-proxy-rw:2375/build?version=1&t=ci-build-probe:latest' > /tmp/build-probe/out.json
          if grep '"errorDetail"' /tmp/build-probe/out.json; then exit 1; fi
          docker image inspect ci-build-probe:latest > /dev/null

          # End to end, through the platform's API: register an app and
          # deploy this very commit. The repo's own Dockerfile builds the
          # dashboard image, which serves /healthz on 8080 without needing
          # anything else, so it makes a fine test app.
          api() {
            docker run --rm --network dashboard_default curlimages/curl:8.11.1 -sS \
              -X "$1" -H 'Content-Type: application/json' ${3:+--data "$3"} "http://platform:8081$2"
          }
          # Requests a visitor would make: from the apps network, via Caddy.
          visit() {
            docker run --rm --network platform-apps curlimages/curl:8.11.1 -sS --max-time 10 \
              -H "Host: $1" "http://caddy$2"
          }
          # Queues a deploy of commit $1, printing the deployment's ID.
          start_deploy() {
            api POST "/api/platform/apps/$APP/deployments" "{\"commitSha\":\"$1\"}" | jq -r .id
          }
          # Prints deployment $1's status ("" while the platform is down).
          deploy_status() {
            api GET "/api/platform/apps/$APP/deployments" 2>/dev/null | jq -r ".[] | select(.id == $1) | .status" 2>/dev/null
          }
          # Waits for deployment $1 to finish, printing its final status.
          wait_deploy() {
            for i in $(seq 1 180); do
              status=$(deploy_status "$1")
              case "$status" in healthy|failed) echo "$status"; return ;; esac
              sleep 5
            done
            echo "timed out"
          }
          # Deploys $1 and waits for it to finish, printing its final status.
          deploy() {
            wait_deploy "$(start_deploy "$1")"
          }
          on_failure() {
            api GET "/api/platform/apps/$APP" | jq .
            docker compose logs platform caddy
            exit 1
          }

          APP=$(api POST /api/platform/apps \
            "{\"name\":\"selftest\",\"repoUrl\":\"$REPO_URL\",\"port\":8080,\"healthCheckPath\":\"/healthz\"}" | jq -r .id)
          [ "$APP" != null ] || on_failure
          api PUT "/api/platform/apps/$APP/env/GREETING" '{"value":"hello"}'

          # First deploy: download, build, start, health-check via Caddy,
          # route. The platform is killed mid-build (SIGKILL, no chance to
          # clean up, as in a crash), and the same deployment must still
          # finish once it's back: its job's lease runs out and the restarted
          # platform claims it again. The build is a cold one (the legacy
          # builder doesn't share BuildKit's cache), so it takes minutes.
          DEP=$(start_deploy "$DEPLOY_SHA")
          for i in $(seq 1 60); do
            [ "$(deploy_status "$DEP")" = building ] && break
            [ "$i" = 60 ] && on_failure
            sleep 1
          done
          sleep 10
          [ "$(deploy_status "$DEP")" = building ] || on_failure
          docker compose kill platform
          docker compose up -d --wait --wait-timeout 60 platform || on_failure
          [ "$(wait_deploy "$DEP")" = healthy ] || on_failure
          docker compose logs --no-log-prefix platform | grep "job started.*deployment=$DEP.*attempt=2" || on_failure
          visit selftest.apps.test /healthz | grep '"ok"' || on_failure

          # Redeploy: the new container replaces the old one, which is
          # removed once the route has switched.
          [ "$(deploy "$DEPLOY_SHA")" = healthy ] || on_failure
          test "$(docker ps -q --filter label=ops.platform.app=selftest | wc -l)" = 1 || on_failure

          # A deploy that fails (a commit that doesn't exist) leaves the
          # live version serving, and says why.
          [ "$(deploy 0000000000000000000000000000000000000000)" = failed ] || on_failure
          api GET "/api/platform/apps/$APP/deployments" | jq -r '.[0].error' | grep 'not found'
          visit selftest.apps.test /healthz | grep '"ok"' || on_failure

          # The published port, as a tailnet device reaches it (here on
          # 127.0.0.1 rather than the Tailscale IP).
          curl -fsS --max-time 10 -H 'Host: selftest.apps.test' http://127.0.0.1/healthz | grep '"ok"' || on_failure

          # The dashboard forwards the platform's API (the Apps pages use
          # it), and refuses changes a browser marks as cross-site (CSRF).
          dash() {
            curl -sS -X "$1" -H 'Content-Type: application/json' ${3:+--data "$3"} "http://127.0.0.1:8080$2"
          }
          dash GET /api/platform/apps | jq -e '.[] | select(.name == "selftest")' > /dev/null || on_failure
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Sec-Fetch-Site: cross-site' \
            -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:8080/api/platform/apps)" = 403

          # Logs, through the dashboard as the browser reads them. The first
          # deploy's log (the one killed mid-build) has the stage messages,
          # Docker's build output and both attempts, and the stream ends by
          # itself, since the deploy has finished.
          curl -sSN --max-time 30 "http://127.0.0.1:8080/api/platform/apps/$APP/deployments/$DEP/logs" > /tmp/deploy.log || on_failure
          grep -F 'Building image' /tmp/deploy.log || on_failure
          grep -F 'Step 1/' /tmp/deploy.log || on_failure
          grep -F '(attempt 2)' /tmp/deploy.log || on_failure
          grep -F 'Live at http://selftest.apps.test/' /tmp/deploy.log || on_failure
          grep -Fx 'event: end' /tmp/deploy.log || on_failure
          # The live app's output: the selftest app (the dashboard image)
          # logs "listening" as it starts. This stream stays open while the
          # app runs, so curl is stopped after a few seconds (exit 28 is that
          # timeout, expected).
          curl -sSN --max-time 5 "http://127.0.0.1:8080/api/platform/apps/$APP/logs" > /tmp/app.log || [ $? = 28 ] || on_failure
          grep -F 'listening' /tmp/app.log || { cat /tmp/app.log; on_failure; }

          # Push-to-deploy: deliveries as GitHub sends them (JSON, signed
          # with the shared secret) to the webhook's own published port.
          # selftest is the only app so far, on this repo's main branch.
          # Prints the response, then the status code on its own line.
          hook() {
            sig="sha256=$(printf '%s' "$3" | openssl dgst -sha256 -hmac "$GITHUB_WEBHOOK_SECRET" | sed 's/^.*= //')"
            curl -sS -X POST -H 'Content-Type: application/json' -H "X-GitHub-Event: $1" \
              -H "X-GitHub-Delivery: $2" -H "X-Hub-Signature-256: $sig" --data-binary "$3" \
              -w '\n%{http_code}\n' http://127.0.0.1:8082/webhooks/github
          }
          PUSH="{\"ref\":\"refs/heads/main\",\"after\":\"$DEPLOY_SHA\",\"deleted\":false,\"repository\":{\"html_url\":\"$REPO_URL\"}}"
          BEFORE=$(api GET "/api/platform/apps/$APP/deployments" | jq length)
          hook ping ci-ping '{"zen":"Design for failure."}' | grep '"pong"' || on_failure
          hook push ci-push-1 "$PUSH" | grep '"deploying"' || on_failure
          # A second push, while the first is (almost certainly) still
          # deploying: it waits, then deploys by itself once the first is
          # done. If the first was already done, it deploys at once. Either
          # way, two new deployments, the second ending live.
          hook push ci-push-2 "$PUSH" | grep -E '"deploying"|"deploys next' || on_failure
          # GitHub redelivering the first push changes nothing.
          hook push ci-push-1 "$PUSH" | grep 'already handled' || on_failure
          # A delivery without the right signature is refused, and the API
          # isn't served on the public port at all.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' -H 'X-GitHub-Delivery: forged' -H 'X-Hub-Signature-256: sha256=00' \
            --data "$PUSH" http://127.0.0.1:8082/webhooks/github)" = 401 || on_failure
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/api/platform/apps)" = 404 || on_failure
          for i in $(seq 1 120); do
            DS=$(api GET "/api/platform/apps/$APP/deployments")
            if [ "$(echo "$DS" | jq length)" -ge $((BEFORE + 2)) ] && [ "$(echo "$DS" | jq -r '.[0].status')" = healthy ]; then
              break
            fi
            [ "$i" = 120 ] && { echo "$DS" | jq .; on_failure; }
            sleep 5
          done
          visit selftest.apps.test /healthz | grep '"ok"' || on_failure

          # examples/hello, registered through the dashboard as the Apps page
          # does it: built from a folder of the repo, with an env var.
          APP=$(dash POST /api/platform/apps \
            "{\"name\":\"hello\",\"repoUrl\":\"$REPO_URL\",\"sourceDir\":\"examples/hello\",\"port\":8080,\"healthCheckPath\":\"/healthz\"}" | jq -r .id)
          [ "$APP" != null ] || on_failure
          dash PUT "/api/platform/apps/$APP/env/GREETING" '{"value":"Howdy"}'
          [ "$(deploy "$DEPLOY_SHA")" = healthy ] || on_failure
          visit hello.apps.test / | grep 'Howdy from the platform' || on_failure
          # "Deploy latest": the platform looks up main's newest commit on
          # GitHub and deploys that (examples/hello is on main).
          DEP=$(dash POST "/api/platform/apps/$APP/deployments/latest" | jq -r .id)
          [ "$DEP" != null ] || on_failure
          [ "$(wait_deploy "$DEP")" = healthy ] || on_failure

          # Zero downtime. A visitor keeps requesting hello from here on, and
          # every request must succeed. First this commit's hello goes live
          # again ("Deploy latest" deployed main's), for its /slow endpoint.
          [ "$(deploy "$DEPLOY_SHA")" = healthy ] || on_failure
          rm -f /tmp/load.stop
          ( while [ ! -f /tmp/load.stop ]; do
              curl -s -o /dev/null -w '%{http_code}\n' --max-time 5 -H 'Host: hello.apps.test' http://127.0.0.1/
              sleep 0.1
            done ) > /tmp/load.txt &
          LOAD=$!
          # A slow request, started on the old version just before a
          # redeploy (a cached build, a few seconds), is still running at the
          # switch. It must finish there: the old container is only stopped
          # once Caddy has no requests in flight to it (up to 15s).
          curl -fsS --max-time 30 -H 'Host: hello.apps.test' 'http://127.0.0.1/slow?seconds=14' > /tmp/slow.txt &
          SLOW=$!
          sleep 1
          DEP=$(start_deploy "$DEPLOY_SHA")
          [ "$(wait_deploy "$DEP")" = healthy ] || on_failure
          wait "$SLOW" || { echo "the slow request was cut off"; on_failure; }
          grep 'Slow answer' /tmp/slow.txt || on_failure
          # It really was in flight at the switch (otherwise this proves
          # nothing), and the old container went once it had finished.
          curl -sSN --max-time 30 "http://127.0.0.1:8080/api/platform/apps/$APP/deployments/$DEP/logs" > /tmp/drain.log || on_failure
          grep -F "for the previous version's requests to finish" /tmp/drain.log || { cat /tmp/drain.log; on_failure; }
          grep -F "The previous version's requests have finished" /tmp/drain.log || { cat /tmp/drain.log; on_failure; }
          # A broken deploy (BROKEN=1 fails hello's health check) never goes
          # live, and the old version serves throughout.
          dash PUT "/api/platform/apps/$APP/env/BROKEN" '{"value":"1"}'
          [ "$(deploy "$DEPLOY_SHA")" = failed ] || on_failure
          api GET "/api/platform/apps/$APP/deployments" | jq -r '.[0].error' | grep 'health check failed' || on_failure
          visit hello.apps.test / | grep 'Howdy from the platform' || on_failure
          dash DELETE "/api/platform/apps/$APP/env/BROKEN"
          # Rollback, through the dashboard as the app page does it, with the
          # visitor still requesting. Two versions with different images are
          # needed ("Deploy latest" may be this same commit): the parent
          # commit, then this one, then back to the parent's deployment. Its
          # image runs again with no build, and the version it replaced is
          # marked rolled back.
          PARENT_SHA=$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${REPO_URL#https://github.com/}/commits/$DEPLOY_SHA" | jq -r '.parents[0].sha')
          OLD=$(start_deploy "$PARENT_SHA")
          [ "$(wait_deploy "$OLD")" = healthy ] || on_failure
          NEW=$(start_deploy "$DEPLOY_SHA")
          [ "$(wait_deploy "$NEW")" = healthy ] || on_failure
          api GET "/api/platform/apps/$APP/deployments" | jq -e ".[] | select(.id == $OLD) | .rollbackable" || on_failure
          RB=$(dash POST "/api/platform/apps/$APP/deployments/$OLD/rollback" | jq -r .id)
          [ "$RB" != null ] || on_failure
          [ "$(wait_deploy "$RB")" = healthy ] || on_failure
          [ "$(deploy_status "$NEW")" = rolled_back ] || on_failure
          test "$(docker inspect --format '{{.Config.Image}}' "app-hello-$RB")" = "ops-platform/hello:$PARENT_SHA" || on_failure
          visit hello.apps.test / | grep 'Howdy from the platform' || on_failure
          curl -sSN --max-time 30 "http://127.0.0.1:8080/api/platform/apps/$APP/deployments/$RB/logs" > /tmp/rollback.log || on_failure
          grep -F 'reusing its image' /tmp/rollback.log || { cat /tmp/rollback.log; on_failure; }
          if grep -F 'Building image' /tmp/rollback.log; then echo "the rollback built an image"; on_failure; fi
          # Auto-deploy is off, so a push doesn't undo it; rolling back to
          # the version that's now live is refused.
          dash GET "/api/platform/apps/$APP" | jq -e '.autoDeploy == false' || on_failure
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            "http://127.0.0.1:8080/api/platform/apps/$APP/deployments/$OLD/rollback")" = 409 || on_failure
          touch /tmp/load.stop
          wait "$LOAD"
          # Every request answered 200, and there were plenty of them.
          sort /tmp/load.txt | uniq -c
          test "$(grep -vc '^200$' /tmp/load.txt)" = 0 || on_failure
          test "$(wc -l < /tmp/load.txt)" -ge 50 || on_failure
          test "$(docker ps -q --filter label=ops.platform.app=hello | wc -l)" = 1 || on_failure

          # Reconciliation: hello is broken from outside the platform in four
          # ways, and each time the reconciler (a pass every 10s) puts it
          # back by itself. Containers the platform doesn't own, one running
          # and one stopped, stay exactly as they are throughout.
          docker run -d --name ci-unmanaged busybox:1.37.0 sleep 600
          docker create --name ci-unmanaged-stopped busybox:1.37.0 true
          # Waits up to 40s for hello to answer through Caddy's published port.
          hello_back() {
            for i in $(seq 1 40); do
              curl -fsS --max-time 2 -H 'Host: hello.apps.test' http://127.0.0.1/healthz 2>/dev/null | grep ok > /dev/null && return 0
              sleep 1
            done
            return 1
          }
          # Waits up to 40s for the platform to log $1 since $SINCE.
          logged() {
            for i in $(seq 1 40); do
              docker compose logs --no-log-prefix --since "$SINCE" platform | grep "$1" && return 0
              sleep 1
            done
            return 1
          }
          HELLO_NAME=$(docker ps --filter label=ops.platform.app=hello --format '{{.Names}}')
          # 1. Killed (as a crash would): the same container is started again.
          #    Its restart policy is "no", so it's the reconciler, not Docker.
          test "$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' "$HELLO_NAME")" = no || on_failure
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker kill "$HELLO_NAME"
          logged "restarted an app's container.*app=hello" || on_failure
          hello_back || on_failure
          # 2. Deleted: recreated under the same name.
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker rm -f "$HELLO_NAME"
          logged "recreated an app's container.*app=hello" || on_failure
          hello_back || on_failure
          test "$(docker ps --filter label=ops.platform.app=hello --format '{{.Names}}')" = "$HELLO_NAME" || on_failure
          # 3. Its route deleted through Caddy's admin API (routes are in app
          #    name order, so hello's is the first): re-applied.
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker run --rm --network dashboard_caddy-admin curlimages/curl:8.11.1 -fsS -X DELETE \
            http://10.203.0.2:2019/config/apps/http/servers/apps/routes/0
          logged "re-applied Caddy's routes" || on_failure
          hello_back || on_failure
          # 4. Stopped while the platform is down, as in a reboot: the
          #    platform's first pass starts it.
          docker compose stop platform
          docker stop "$HELLO_NAME"
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker compose start platform
          logged 'first reconcile pass done' || on_failure
          hello_back || on_failure
          # Untouched, after all those passes.
          test "$(docker inspect -f '{{.State.Status}}' ci-unmanaged)" = running || on_failure
          test "$(docker inspect -f '{{.State.Status}}' ci-unmanaged-stopped)" = created || on_failure
          docker rm -f ci-unmanaged ci-unmanaged-stopped
          # Each fix is an event, read through the dashboard as its pages do:
          # hello's own (the kill's restart with hello's last output lines,
          # the recreate, the first pass's restart) and the routes fix,
          # which is about no app.
          dash GET "/api/platform/apps/$APP" | jq '.events' > /tmp/events.json
          jq -e 'map(.kind) | index("restarted") and index("recreated")' /tmp/events.json || { cat /tmp/events.json; on_failure; }
          jq -e 'map(select(.kind == "restarted")) | last | .output | length > 0' /tmp/events.json || { cat /tmp/events.json; on_failure; }
          dash GET /api/platform/events | jq -e 'map(select(.kind == "routes_reapplied" and .appId == null)) | length > 0' || on_failure

          # Databases: hello gets one, through the dashboard. The reconciler
          # creates it within a pass (postgres:18.6 is already here: the
          # platform's own database uses it); the next deploy gives hello
          # DATABASE_URL, and /visits counts in it.
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          dash POST "/api/platform/apps/$APP/database" | jq -e '.name == "ops-db-hello"' || on_failure
          logged "created an app's database.*app=hello" || on_failure
          test "$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' ops-db-hello)" = no || on_failure
          [ "$(deploy "$DEPLOY_SHA")" = healthy ] || on_failure
          # Counts a visit, waiting up to 30s for the database to answer;
          # prints the count.
          count_visit() {
            for i in $(seq 1 30); do
              out=$(curl -fsS --max-time 2 -H 'Host: hello.apps.test' http://127.0.0.1/visits 2>/dev/null) && { echo "${out#Visits: }"; return 0; }
              sleep 1
            done
            return 1
          }
          A=$(count_visit) || on_failure
          test "$(count_visit)" = $((A + 1)) || on_failure
          # The count survives a redeploy...
          [ "$(deploy "$DEPLOY_SHA")" = healthy ] || on_failure
          test "$(count_visit)" = $((A + 2)) || on_failure
          # ...and the database's container being deleted: recreated, with
          # its data on its volume.
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker rm -f ops-db-hello
          logged "recreated an app's database.*app=hello" || on_failure
          test "$(count_visit)" = $((A + 3)) || on_failure
          # Only hello's own containers can reach it: not another app, from
          # the apps network.
          if docker run --rm --network platform-apps busybox:1.37.0 nc -z -w 3 ops-db-hello 5432; then
            echo "hello's database is reachable from the apps network"; exit 1
          fi
          # Its password is never shown: not by the API, not in deploy logs.
          if dash GET "/api/platform/apps/$APP" | grep 'postgres://' > /dev/null; then
            echo "the API shows DATABASE_URL"; exit 1
          fi
          DEP=$(dash GET "/api/platform/apps/$APP" | jq -r '.deployments[0].id')
          if curl -sSN --max-time 30 "http://127.0.0.1:8080/api/platform/apps/$APP/deployments/$DEP/logs" | grep 'postgres://' > /dev/null; then
            echo "a deploy log shows DATABASE_URL"; exit 1
          fi

          # A source directory that doesn't exist fails with a clear reason
          # (found mid-stream, so this also checks the reason survives
          # Docker's client).
          APP=$(api POST /api/platform/apps \
            "{\"name\":\"nodir\",\"repoUrl\":\"$REPO_URL\",\"sourceDir\":\"no/such/dir\",\"port\":8080}" | jq -r .id)
          [ "$APP" != null ] || on_failure
          [ "$(deploy "$DEPLOY_SHA")" = failed ] || on_failure
          api GET "/api/platform/apps/$APP/deployments" | jq -r '.[0].error' | grep 'source directory not found' || on_failure

          # Isolation: an app can reach neither Caddy's admin API nor the
          # platform.
          if docker run --rm --network platform-apps curlimages/curl:8.11.1 -s --max-time 5 http://caddy:2019/config/; then
            echo "Caddy admin API reachable from the apps network"; exit 1
          fi
          if docker run --rm --network platform-apps curlimages/curl:8.11.1 -s --max-time 5 http://platform:8081/healthz; then
            echo "platform reachable from the apps network"; exit 1
          fi

          # Restarts: Caddy comes back with its routes (--resume), and the
          # platform comes back with nothing left to migrate, re-applies the
          # routes, and leaves the live container alone.
          docker compose restart caddy
          sleep 2
          visit selftest.apps.test /healthz | grep '"ok"' || on_failure
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker compose restart platform
          docker compose up -d --wait --wait-timeout 60 platform
          docker compose logs --no-log-prefix platform | grep 'database schema up to date' | tail -1 | grep -F 'applied=[]'
          # Its own logs since the restart (the container's logs span every
          # restart).
          for i in $(seq 1 15); do
            docker compose logs --no-log-prefix --since "$SINCE" platform | grep 'first reconcile pass done' && break
            [ "$i" = 15 ] && on_failure
            sleep 1
          done
          visit selftest.apps.test /healthz | grep '"ok"' || on_failure
          test "$(docker ps -q --filter label=ops.platform.app=selftest | wc -l)" = 1 || on_failure

          # A reboot starts containers in any order. With the platform up
          # first, it must not take Caddy's fixed admin address (this broke
          # Caddy on the server's first reboot). Stopping releases each
          # container's addresses; starting assigns them afresh.
          docker compose stop caddy platform
          docker compose start platform
          docker compose start caddy
          docker compose up -d --wait --wait-timeout 60 caddy platform || on_failure
          visit selftest.apps.test /healthz | grep '"ok"' || on_failure

          # App containers aren't Compose's, so remove them first, or the
          # apps network can't be deleted; with the platform stopped, or its
          # reconciler would recreate them.
          docker compose stop platform
          docker rm -f $(docker ps -aq --filter label=ops.platform.managed=true)
          docker compose down -v
