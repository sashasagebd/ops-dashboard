name: dashboard

services:
  dashboard:
    build: .
    restart: unless-stopped
    ports:
      # 127.0.0.1 only. Docker writes its own iptables rules and bypasses UFW,
      # so a bare "8080:8080" would be reachable from the whole LAN. Remote
      # access goes through `tailscale serve` instead.
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
      POLL_INTERVAL: ${POLL_INTERVAL:-5s}
    depends_on:
      - docker-proxy
    networks:
      - default # for the published port
      - docker-api # to reach the socket proxy
    # Hardening: the app writes nothing to disk and needs no Linux capabilities.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      # Allow GET/HEAD on /containers only (plus the proxy's harmless defaults:
      # /_ping, /version, /events). Everything else answers 403.
      CONTAINERS: 1
      # 0 is the default; set explicitly because it's the setting that matters.
      POST: 0
    volumes:
      # :ro does NOT make the API read-only: anything that can connect to the
      # socket can still send write requests. The protection is POST=0 above,
      # plus this service having no published port and only being on the
      # internal docker-api network.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

  # The deploy platform's control plane (docs/platform-plan.md). Same image
  # as the dashboard, different binary. A separate service so monitoring
  # keeps working when the platform doesn't, and so only the platform can
  # write to Docker (docs/decisions/platform.md). No published port.
  platform:
    build: .
    entrypoint: ["/platform"]
    restart: unless-stopped
    environment:
      # Hex passwords (see .env.example) need no escaping in a URL. No TLS:
      # the connection never leaves the internal platform-db network.
      DATABASE_URL: postgres://platform:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/platform?sslmode=disable
      DOCKER_HOST: tcp://docker-proxy-rw:2375
      # Encrypts app env vars in the database. Losing it means losing every
      # stored env var value (see .env.example).
      PLATFORM_SECRET_KEY: ${PLATFORM_SECRET_KEY:?set PLATFORM_SECRET_KEY in .env}
    # The image's HEALTHCHECK is the dashboard's, so it's replaced here. The
    # platform only listens once Postgres answers and migrations have run,
    # hence the longer start period.
    healthcheck:
      test: ["CMD", "/platform", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      # Check often while starting, so it reports healthy (and depends_on /
      # `up --wait` move on) seconds after it's ready, not up to 30s later.
      start_interval: 2s
      retries: 3
    # Only applies to `docker compose up`. After a reboot Docker starts
    # containers in any order, and the platform waits for Postgres itself.
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy-rw:
        condition: service_started
    networks:
      - platform-db
      - docker-rw
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

  # The platform's socket proxy. Unlike the dashboard's, it allows writes:
  # building images and creating, starting, stopping and removing
  # containers. With POST=1 the proxy allows every method on each enabled
  # group, so the protection is enabling as few groups as possible (exec,
  # volumes, swarm, secrets and the rest stay off) plus only the platform
  # being able to reach it. Creating containers is still root-equivalent on
  # the host; see docs/decisions/platform.md.
  docker-proxy-rw:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      POST: 1
      CONTAINERS: 1
      IMAGES: 1
      BUILD: 1
      NETWORKS: 1
    volumes:
      # :ro doesn't restrict the API (see docker-proxy); it only stops this
      # container replacing the socket file itself.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-rw
    security_opt: ["no-new-privileges:true"]

  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      # Only read when the volume is first initialised. Changing it later
      # means ALTER USER inside Postgres as well as editing .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: platform
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker and
      # expect the volume one level up, at /var/lib/postgresql (older guides
      # say /var/lib/postgresql/data, which 18 refuses to start with).
      - platform-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "platform", "-d", "platform"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
      retries: 5
    # The image stops with SIGINT (fast shutdown), which can take longer than
    # Compose's default 10s before it resorts to SIGKILL; a killed Postgres
    # has to run crash recovery on its next start.
    stop_grace_period: 1m
    networks:
      - platform-db
    security_opt: ["no-new-privileges:true"]
    # A ceiling, not a reservation: idle use is far lower. Leaves the game
    # servers their headroom.
    mem_limit: 512m

networks:
  docker-api:
    # No route to the outside world; only services attached to it can talk.
    internal: true
  platform-db:
    # Only the platform and Postgres are on it, so Postgres has no published
    # port and nothing else can reach it.
    internal: true
  docker-rw:
    # Only the platform and its write proxy: nothing else (in particular, no
    # deployed app) can reach the proxy that creates containers.
    internal: true

volumes:
  # The platform's database. `docker compose down` keeps it; only
  # `docker compose down -v` (or `docker volume rm`) deletes it.
  platform-db:
